[package]
name = "suitaku-core"
version = "0.1.0"
edition = "2021"
description = "Rust core skeleton for the 翠卓 JS engine"

[lib]
path = "src/lib.rs"

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
