<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#132827" />
  <title>翠卓 — リーチ麻雀</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="brand-mark">發</span><div>翠卓 <small>SUITAKU / RIICHI MAHJONG</small></div></div>
      <span id="match-label">四人打ち</span>
      <div class="toolbar"><button id="btn-export">牌譜を保存</button><button id="btn-rules" aria-label="ルールと操作方法">?</button><button id="btn-new">新規対局</button></div>
    </header>
    <main class="workspace">
      <section class="play-area" aria-label="麻雀卓">
        <div class="table-caption"><span><i class="live-dot"></i><span id="round-info">対局準備</span></span><span><label><input type="checkbox" id="sound-enabled" checked /> 効果音</label><button id="btn-voices" class="voice-button">発声WAV</button><label><input type="checkbox" id="speed-fast" /> 高速進行</label></span></div>
        <div class="table-viewport"><div id="table">
          <div class="table-line"></div>
          <div class="seat seat-top" id="seat-2"></div>
          <div class="seat seat-left" id="seat-3"></div>
          <div class="seat seat-right" id="seat-1"></div>
          <div class="center" id="center"><div class="center-brand">翠卓</div><small>一打を、考える。</small></div>
          <div class="river river-bottom" id="river-0"></div>
          <div class="river river-right" id="river-1"></div>
          <div class="river river-top" id="river-2"></div>
          <div class="river river-left" id="river-3"></div>
          <div class="seat seat-bottom" id="seat-0"></div>
          <div id="discard-flight" aria-hidden="true"></div>
        </div></div>
        <section id="review-timeline" class="hidden" aria-label="牌譜再生操作"></section>
        <div id="controls"><span class="hint">対局を設定してください</span></div>
        <div class="table-footer"><span>赤あり・喰いタンあり・頭ハネ</span><span>GL-MahjongTile · Gutenberg Labo</span></div>
      </section>
      <aside class="sidebar">
        <section class="side-card"><div class="section-label">TABLE STATUS <span>卓情報</span></div><div class="wall-status"><span>残りツモ</span><strong id="wall-info">—<small>枚</small></strong></div><div class="wall-meter"><div id="wall-meter-fill"></div></div><div class="dora-label">ドラ表示牌</div><div id="dora-info"></div><p class="muted">裏向きの牌は槓で開かれます</p></section>
        <section class="side-card"><div class="section-label">YOUR HAND <span>手牌ガイド</span></div><div id="hand-guide">対局開始を待っています</div><label class="subtle-check"><input type="checkbox" id="show-guide" checked /> 向聴数・待ちを表示</label></section>
        <section class="side-card record-card"><div class="section-label">GAME RECORD <span>対局記録</span></div><div id="log" aria-live="polite"></div><button id="btn-note" class="text-button">＋ 直前の打牌に検討メモ</button><p class="muted">牌譜にはAIの候補評価も記録。<br>気になった一打を、あとから検討できます。</p></section>
        <section id="review-controls" class="side-card hidden"></section>
      </aside>
    </main>
  </div>
  <div id="overlay" class="hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" role="status"></div>
  <input id="replay-file" type="file" accept=".json,application/json" hidden />
  <input id="voice-files" type="file" accept=".wav,audio/wav" multiple hidden />
  <script src="src/tiles.js"></script>
  <script src="src/shanten.js"></script>
  <script src="src/agari.js"></script>
  <script src="src/yaku.js"></script>
  <script src="src/score.js"></script>
  <script src="src/ai.js"></script>
  <script src="src/game.js"></script>
  <script src="src/record.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/ui.js"></script>
</body>
</html>
